name: KirinMaL Android APK Release

on:
  push:
    paths:
      - 'version.properties'
  workflow_dispatch:
    inputs:
      single_apk:
        description: 'Build only the universal apk'
        type: boolean

env:
  BRANCH_NAME: ${{ github.base_ref || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decode Keystore File
        uses: timheuer/base64-to-file@v2
        id: android_keystore
        with:
          fileName: "android_keystore.keystore"
          encodedString: ${{secrets.KEYSTORE_FILE}}
      
      - name: Accept Android SDK license
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - if: ${{ inputs.single_apk == true || env.BRANCH_NAME == 'develop' }}
        run: sed -i -e '/isEnable/s/true/false/' app/androidApp/build.gradle.kts

      - name: Set MAL Client Secret ID
        run: touch private.properties && echo 'CLIENT_SECRET=""' > private.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Android release
        run: fastlane release
        env:
          KEYSTORE_FILE: ${{steps.android_keystore.outputs.filePath}}
          KEYSTORE_PASSWORD: ${{secrets.KEYSTORE_PASSWORD}}
          KEY_ALIAS: ${{secrets.KEY_ALIAS}}
          KEY_PASSWORD: ${{secrets.KEY_PASSWORD}}

      - name: Publish signed APK to versioned GitHub Release
        env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(awk -F= '/^name[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' version.properties)"
          test -n "$version" || { echo "Missing version in version.properties"; exit 1; }
          bash tools/publish_release.sh "v$version" android-release app/androidApp/build/outputs/apk/release/*.apk
