name: KirinMaL Signed Release

on:
  push:
    branches: [main]
    paths:
      - 'version.properties'
      - 'tools/audit_android_release.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kirinmal-stable-release
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare app resources
        run: |
          printf 'CLIENT_SECRET=""\n' > private.properties
          chmod +x ./gradlew
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/generate_brand_assets.py
      - name: Restore private signing keystore
        env:
          SIGNING_BASE64: ${{ secrets.KEYSTORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SIGNING_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing signing secret: $name. Add all four values from your private signing ZIP in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SIGNING_BASE64" | base64 --decode > "$RUNNER_TEMP/KirinMaL-release.jks"
          test -s "$RUNNER_TEMP/KirinMaL-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/KirinMaL-release.jks" >> "$GITHUB_ENV"
      - name: Validate signing keystore and private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Reading the alias alone does not verify the private-key password.
          # Importing into an ephemeral PKCS12 file checks all four secrets.
          if ! keytool -importkeystore -noprompt \
            -srckeystore "$KEYSTORE_FILE" -srcstoretype JKS \
            -srcstorepass:env KEYSTORE_PASSWORD -srckeypass:env KEY_PASSWORD \
            -srcalias "$KEY_ALIAS" -destkeystore "$RUNNER_TEMP/signing-check.p12" \
            -deststoretype PKCS12 -deststorepass:env KEYSTORE_PASSWORD \
            > "$RUNNER_TEMP/signing-check.log" 2>&1; then
            echo "::error::Keystore could not unlock the private key. Update the KEY_PASSWORD secret with the exact KEY_PASSWORD value in GitHub-Secrets-4-Kunci.txt from your private ZIP; check KEYSTORE_PASSWORD and KEY_ALIAS too."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/signing-check.p12" "$RUNNER_TEMP/signing-check.log"
          echo "Private signing key successfully verified."

      - name: Require the owner's MyAnimeList Client ID
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAL_CLIENT_ID:-}" ]]; then
            echo "::error::Missing MAL_CLIENT_ID. Register your own MyAnimeList API application and add its Client ID in Settings > Secrets and variables > Actions. Redirect URI: kirinmal://oauth/mal"
            exit 1
          fi
          case "$MAL_CLIENT_ID" in
            *[!a-zA-Z0-9]*)
              echo "::error::MAL_CLIENT_ID must contain only letters and digits. Copy only the client ID, not the label or URL."
              exit 1
              ;;
          esac
          echo "Custom MyAnimeList Client ID configured for this Android release."

      - name: Verify KirinMaL Android app identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.lanzmagick.kirinmal"' app/androidApp/build.gradle.kts
          grep -Fq 'mapOf("oidcRedirectScheme" to "kirinmal")' app/androidApp/build.gradle.kts
          grep -Fq 'actual val AUTH_REDIRECT_URI: String = "kirinmal://oauth/mal"' core/data/src/androidMain/kotlin/com/axiel7/moelist/data/utils/Constants.android.kt
          grep -Fq 'android:name="com.axiel7.moelist.KirinMaLApplication"' app/androidApp/src/main/AndroidManifest.xml
          if grep -Fq 'android:targetPackage="com.axiel7.moelist"' app/androidApp/src/main/res/xml-v25/shortcuts.xml; then
            echo "::error::An Android shortcut still launches the original MoeList package"
            exit 1
          fi
          grep -Fq 'android:targetPackage="com.lanzmagick.kirinmal"' app/androidApp/src/main/res/xml-v25/shortcuts.xml
          echo "KirinMaL has its own Android package ID."

      - name: Test Home recommendations, Magic settings and Jikan genre contracts
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: ./gradlew :app:shared:jvmTest --tests '*ShuffleBagTest' --tests '*MagicPreferencesTest' --tests '*MangaRecommendationSelectorTest' --tests '*JikanCatalogApiTest' --no-daemon --no-configuration-cache --stacktrace

      - name: Build signed production APKs
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:androidApp:assembleRelease --no-daemon --no-configuration-cache --stacktrace
      - name: Verify every APK has an Android release signature
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/androidApp/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0 || { echo "::error::No release APKs produced"; exit 1; }
          tool="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$tool"
          for apk in "${apks[@]}"; do
            "$tool" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature-report.txt"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-signature-report.txt" || {
              echo "::error::APK lacks v2 release signature: $apk"; exit 1;
            }
            echo "Verified signed release: $(basename "$apk")"
          done
      - name: Audit signed APK manifest, permissions and identity
        shell: bash
        run: bash tools/audit_android_release.sh app/androidApp/build/outputs/apk/release/*.apk

      - name: Publish audited KirinMaL Android release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^name[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' version.properties)"
          test -n "$version"
          bash tools/publish_release.sh "v$version" android-release app/androidApp/build/outputs/apk/release/*.apk
          # Remove the old debug release only after a signed stable APK exists.
          if gh release view development --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete development --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          fi
