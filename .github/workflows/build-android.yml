name: KirinMaL Signed Release

on:
  push:
    branches: [main]
    paths:
      - 'buildSrc/src/main/kotlin/Version.kt'
      - 'tools/audit_android_release.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kirinmal-stable-release
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare app resources
        run: |
          printf 'CLIENT_SECRET=""\n' > private.properties
          chmod +x ./gradlew
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/generate_brand_assets.py
      - name: Restore and validate persistent signing key (two secrets)
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_SIGNING_KEYSTORE_BASE64:-}" || -z "${ANDROID_SIGNING_PASSWORD:-}" ]]; then
            echo "::error::Add the two signing secrets: ANDROID_SIGNING_KEYSTORE_BASE64 and ANDROID_SIGNING_PASSWORD."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/KirinMaL-release.jks"
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          # Verify the store password, the kirinmal alias, and that the same password unlocks the private key.
          if ! keytool -importkeystore -noprompt \
            -srckeystore "$KEYSTORE_PATH" -srcstoretype JKS \
            -srcstorepass:env ANDROID_SIGNING_PASSWORD \
            -srckeypass:env ANDROID_SIGNING_PASSWORD \
            -srcalias kirinmal \
            -destkeystore "$RUNNER_TEMP/KirinMaL-signing-check.p12" \
            -deststoretype PKCS12 -deststorepass:env ANDROID_SIGNING_PASSWORD \
            > "$RUNNER_TEMP/KirinMaL-signing-check.log" 2>&1; then
            echo "::error::Signing key could not be opened. Check the password and that the keystore alias is kirinmal."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/KirinMaL-signing-check.p12" "$RUNNER_TEMP/KirinMaL-signing-check.log"

          # Gradle uses these local environment variables; they are not GitHub Secrets.
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$ANDROID_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$ANDROID_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=kirinmal" >> "$GITHUB_ENV"
          echo "KirinMaL signing key verified."

      - name: Require the owner's MyAnimeList Client ID
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAL_CLIENT_ID:-}" ]]; then
            echo "::error::Missing MAL_CLIENT_ID. Register your own MyAnimeList API application and add its Client ID in Settings > Secrets and variables > Actions. Redirect URI: kirinmal://oauth/mal"
            exit 1
          fi
          case "$MAL_CLIENT_ID" in
            *[!a-zA-Z0-9]*)
              echo "::error::MAL_CLIENT_ID must contain only letters and digits. Copy only the client ID, not the label or URL."
              exit 1
              ;;
          esac
          echo "Custom MyAnimeList Client ID configured for this Android release."

      - name: Validate version and matching release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^[[:space:]]*const val NAME = "([^"]+)".*/\1/p' buildSrc/src/main/kotlin/Version.kt | head -n 1)"
          CODE="$(sed -nE 's/^[[:space:]]*const val CODE = ([0-9]+).*/\1/p' buildSrc/src/main/kotlin/Version.kt | head -n 1)"
          test -n "$VERSION" || { echo "::error::AppVersion.NAME is missing"; exit 1; }
          test -n "$CODE" || { echo "::error::AppVersion.CODE is missing"; exit 1; }
          NOTES="release-notes/$VERSION.md"
          test -s "$NOTES" || { echo "::error::Create $NOTES from release-notes/_TEMPLATE.md before publishing"; exit 1; }
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Validated KirinMaL v$VERSION (version code $CODE) and $NOTES."

      - name: Verify KirinMaL Android app identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.lanzmagick.kirinmal"' app/androidApp/build.gradle.kts
          grep -Fq 'mapOf("oidcRedirectScheme" to "kirinmal")' app/androidApp/build.gradle.kts
          grep -Fq 'actual val AUTH_REDIRECT_URI: String = "kirinmal://oauth/mal"' core/data/src/androidMain/kotlin/com/axiel7/moelist/data/utils/Constants.android.kt
          grep -Fq 'android:name="com.axiel7.moelist.KirinMaLApplication"' app/androidApp/src/main/AndroidManifest.xml
          if grep -Fq 'android:targetPackage="com.axiel7.moelist"' app/androidApp/src/main/res/xml-v25/shortcuts.xml; then
            echo "::error::An Android shortcut still launches the original MoeList package"
            exit 1
          fi
          grep -Fq 'android:targetPackage="com.lanzmagick.kirinmal"' app/androidApp/src/main/res/xml-v25/shortcuts.xml
          echo "KirinMaL has its own Android package ID."

      - name: Test session startup, list navigation, Home recommendations and Magic settings
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: ./gradlew :app:shared:jvmTest --tests '*SessionStateTest' --tests '*ListSortDestinationTest' --tests '*ShuffleBagTest' --tests '*MagicPreferencesTest' --tests '*MangaRecommendationSelectorTest' --no-daemon --no-configuration-cache --stacktrace

      - name: Build signed production APKs
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: ./gradlew :app:androidApp:assembleRelease --no-daemon --no-configuration-cache --stacktrace
      - name: Verify every APK has an Android release signature
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/androidApp/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0 || { echo "::error::No release APKs produced"; exit 1; }
          tool="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$tool"
          for apk in "${apks[@]}"; do
            "$tool" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature-report.txt"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-signature-report.txt" || {
              echo "::error::APK lacks v2 release signature: $apk"; exit 1;
            }
            echo "Verified signed release: $(basename "$apk")"
          done
      - name: Audit signed APK manifest, permissions and identity
        shell: bash
        run: bash tools/audit_android_release.sh app/androidApp/build/outputs/apk/release/*.apk

      - name: Publish audited KirinMaL Android release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_VERSION"
          bash tools/publish_release.sh "v$RELEASE_VERSION" android-release app/androidApp/build/outputs/apk/release/*.apk
          # Remove the old debug release only after a signed stable APK exists.
          if gh release view development --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete development --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          fi
