name: Verify KirinMaL Android Debug

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-android.yml'
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'version.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Ubuntu GitHub-hosted runners already provide the Android SDK.
      # Avoid setup-android's obsolete 'tools' package installation.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare public Android build
        run: |
          printf 'CLIENT_SECRET=""\n' > private.properties
          chmod +x ./gradlew

      - name: Ensure KirinMaL icons are generated
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/generate_brand_assets.py

      - name: Assemble debug APK
        run: ./gradlew :app:androidApp:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KirinMaL-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
