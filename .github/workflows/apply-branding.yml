name: Apply KirinMaL App Icons

on:
  push:
    branches:
      - main
    paths:
      - 'assets/branding/**'
      - 'tools/generate_brand_assets.py'
      - '.github/workflows/apply-branding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate platform assets
        run: python tools/generate_brand_assets.py

      - name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/androidApp/src/main/ app/desktopApp/icons/ app/iosApp/iosApp/Assets.xcassets/AppIcon.appiconset/ core/resources/src/commonMain/composeResources/drawable/kirinmal_logo.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: generate KirinMaL launcher icons for all platforms"
            git push
          fi
